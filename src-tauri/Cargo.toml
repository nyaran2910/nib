[package]
name = "nib"
version = "0.1.0"
description = "Ultra-lightweight, multi-window, local-first Markdown notes app for macOS and iOS"
authors = ["Nib Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "7"
dirs = "6"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
async-trait = "0.1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
